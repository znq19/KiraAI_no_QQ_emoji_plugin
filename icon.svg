<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="t">
  <title id="t">No QQ Emoji</title>
  <defs>
    <!-- Transparent gap around the slash, so the icon reads on light and dark backgrounds -->
    <mask id="gap">
      <rect width="24" height="24" fill="#fff"/>
      <line x1="6.15" y1="17.85" x2="17.85" y2="6.15" stroke="#000" stroke-width="2.9"
            stroke-linecap="round"/>
    </mask>
  </defs>

  <g mask="url(#gap)">
    <!-- QQ face -->
    <circle cx="12" cy="12" r="6.8" fill="#FFC93C"/>
    <!-- eyes -->
    <circle cx="9.8" cy="10.3" r="1.05" fill="#2B2B2B"/>
    <circle cx="14.2" cy="10.3" r="1.05" fill="#2B2B2B"/>
    <!-- smile -->
    <path d="M9.55 13.35q2.45 2.35 4.9 0" fill="none" stroke="#2B2B2B" stroke-width="1.3"
          stroke-linecap="round"/>
    <!-- prohibition ring -->
    <circle cx="12" cy="12" r="9.35" fill="none" stroke="#E5484D" stroke-width="1.9"/>
  </g>

  <!-- slash, contained inside the ring -->
  <line x1="6.15" y1="17.85" x2="17.85" y2="6.15" stroke="#E5484D" stroke-width="1.9"
        stroke-linecap="round"/>
</svg>
